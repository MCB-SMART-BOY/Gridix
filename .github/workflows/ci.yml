name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ── Stage 1: Quality Gate ──────────────────────────────────────────
  # 所有触发事件都执行：PR / push main / push tag
  quality:
    name: Quality Gate
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-quality-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-quality-

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev

      - name: Format check
        run: cargo fmt --check

      - name: Lint check
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --lib

      - name: Doc links
        run: cargo run --bin check-doc-links

      - name: Security audit
        run: |
          cargo install cargo-audit --locked
          cargo audit

  # ── Stage 2: Build ─────────────────────────────────────────────────
  # 仅 push main 或 push tag 时执行（跳过 PR）
  build:
    name: Build (${{ matrix.name }})
    needs: [quality]
    if: github.event_name == 'push'
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            name: linux-x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            name: windows-x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            name: macos-arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-build-${{ matrix.target }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-build-${{ matrix.target }}-

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            cd target/${{ matrix.target }}/release
            7z a ../../../gridix-${{ matrix.name }}.zip gridix.exe
          else
            cd target/${{ matrix.target }}/release
            tar czvf ../../../gridix-${{ matrix.name }}.tar.gz gridix
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: gridix-${{ matrix.name }}
          path: gridix-${{ matrix.name }}.*

  # ── Stage 2b: AppImage ─────────────────────────────────────────────
  build-appimage:
    name: Build AppImage
    needs: [quality]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-appimage-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-appimage-

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev fuse libfuse2
          wget -q https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage -O appimagetool
          chmod +x appimagetool
          sudo mv appimagetool /usr/local/bin/

      - name: Install cargo-appimage
        run: cargo install cargo-appimage --locked

      - name: Prepare AppImage icon
        run: cp assets/branding/gridix-icon.png icon.png

      - name: Build AppImage
        run: |
          cargo appimage
          mv target/appimage/gridix*.AppImage gridix.AppImage

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: gridix.AppImage
          path: gridix.AppImage

  # ── Stage 3: Release ───────────────────────────────────────────────
  # 仅 push tag 时执行 — 直接下载 build stage 产物，不重复编译
  release:
    name: GitHub Release
    needs: [quality, build, build-appimage]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd artifacts
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          fail_on_unmatched_files: true
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
