name: PostgreSQL Integration

on:
  workflow_dispatch:
  schedule:
    - cron: '0 4 * * 1'
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
permissions:
  contents: read


env:
  CARGO_TERM_COLOR: always

jobs:
  postgresql-integration:
    name: PostgreSQL Typed Integration
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
        env:
          POSTGRES_PASSWORD: gridix
          POSTGRES_USER: gridix
          POSTGRES_DB: gridix_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U gridix -d gridix_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    env:
      GRIDIX_TEST_PG_URL: postgres://gridix:gridix@127.0.0.1:5432/gridix_test
      GRIDIX_ACCEPTANCE: "1"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1
        with:
          toolchain: nightly

      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-pg-it-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-pg-it-

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev

      - name: Run PostgreSQL typed integration tests
        run: |
          : "${GRIDIX_TEST_PG_URL:?GRIDIX_TEST_PG_URL must be set for release acceptance}"
          test "${GRIDIX_ACCEPTANCE}" = "1" || {
            echo "GRIDIX_ACCEPTANCE must be 1, otherwise the acceptance suites skip and prove nothing"
            exit 1
          }
          cargo test --test postgres_typed_e2e -- --nocapture --test-threads=1
          cargo test --test postgres_cancel_integration -- --nocapture --test-threads=1
          cargo test --test postgres_pool_acceptance -- --nocapture --test-threads=1
          cargo test --test postgres_tab_sessions -- --nocapture --test-threads=1
