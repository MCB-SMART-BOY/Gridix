name: PostgreSQL Integration

on:
  workflow_dispatch:
  schedule:
    - cron: '0 4 * * 1'
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
permissions:
  contents: read


env:
  CARGO_TERM_COLOR: always

jobs:
  postgresql-integration:
    name: PostgreSQL Typed Integration
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres@sha256:3c5c8892d184f738f4fe282d14ddaa613a38f00f4189d2d94725ebe6f2909ddb
        env:
          POSTGRES_PASSWORD: gridix
          POSTGRES_USER: gridix
          POSTGRES_DB: gridix_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U gridix -d gridix_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    env:
      GRIDIX_TEST_PG_URL: postgres://gridix:gridix@127.0.0.1:5432/gridix_test
      GRIDIX_ACCEPTANCE: "1"

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable (2026-09-03)
        with:
          toolchain: 1.98.1

      - name: Cache cargo
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-pg-it-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-pg-it-

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev

      - name: Run PostgreSQL typed integration tests
        run: |
          : "${GRIDIX_TEST_PG_URL:?GRIDIX_TEST_PG_URL must be set for release acceptance}"
          test "${GRIDIX_ACCEPTANCE}" = "1" || {
            echo "GRIDIX_ACCEPTANCE must be 1, otherwise the acceptance suites skip and prove nothing"
            exit 1
          }
          cargo test --test postgres_typed_e2e -- --nocapture --test-threads=1
          cargo test --test postgres_cancel_integration -- --nocapture --test-threads=1
          cargo test --test postgres_pool_acceptance -- --nocapture --test-threads=1
