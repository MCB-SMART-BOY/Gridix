name: MySQL Integration

on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * 1'
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always

jobs:
  mysql-integration:
    name: MySQL Typed Integration
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: gridix_test
          MYSQL_USER: gridix
          MYSQL_PASSWORD: gridix
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12

    env:
      GRIDIX_TEST_MYSQL_URL: mysql://gridix:gridix@127.0.0.1:3306/gridix_test

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-mysql-it-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-mysql-it-

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev

      - name: Grant MySQL cancellation observer permissions
        run: >-
          docker exec ${{ job.services.mysql.id }}
          mysql -uroot -proot
          -e "GRANT PROCESS, CONNECTION_ADMIN ON *.* TO 'gridix'@'%'; FLUSH PRIVILEGES;"

      - name: Run MySQL typed integration tests
        run: |
          : "${GRIDIX_TEST_MYSQL_URL:?GRIDIX_TEST_MYSQL_URL must be set for release acceptance}"
          cargo test --test mysql_typed_e2e -- --nocapture --test-threads=1
          cargo test --test mysql_cancel_integration -- --nocapture --test-threads=1
