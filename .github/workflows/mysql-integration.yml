name: MySQL Integration

on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * 1'
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
permissions:
  contents: read


env:
  CARGO_TERM_COLOR: always

jobs:
  mysql-integration:
    name: MySQL Typed Integration
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      mysql:
        image: mysql@sha256:85b9bf2e29cf836ecb8c2a15a935d4ba0c606631dff1dd79531a11983c638f2a
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: gridix_test
          MYSQL_USER: gridix
          MYSQL_PASSWORD: gridix
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    env:
      GRIDIX_TEST_MYSQL_URL: mysql://gridix:gridix@127.0.0.1:3306/gridix_test
      GRIDIX_ACCEPTANCE: "1"

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable (2026-09-03)
        with:
          toolchain: 1.98.1

      - name: Cache cargo
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-mysql-it-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-mysql-it-

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev

      - name: Grant MySQL cancellation observer permissions
        run: >-
          docker exec ${{ job.services.mysql.id }}
          mysql -uroot -proot
          -e "GRANT PROCESS, CONNECTION_ADMIN ON *.* TO 'gridix'@'%'; FLUSH PRIVILEGES;"

      - name: Run MySQL typed integration tests
        run: |
          : "${GRIDIX_TEST_MYSQL_URL:?GRIDIX_TEST_MYSQL_URL must be set for release acceptance}"
          test "${GRIDIX_ACCEPTANCE}" = "1" || {
            echo "GRIDIX_ACCEPTANCE must be 1, otherwise the acceptance suites skip and prove nothing"
            exit 1
          }
          cargo test --test mysql_typed_e2e -- --nocapture --test-threads=1
          cargo test --test mysql_cancel_integration -- --nocapture --test-threads=1
          cargo test --test mysql_pool_acceptance -- --nocapture --test-threads=1
