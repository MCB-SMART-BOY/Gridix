name: MySQL Integration

on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * 1'
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
permissions:
  contents: read


env:
  CARGO_TERM_COLOR: always

jobs:
  mysql-integration:
    name: MySQL Typed Integration
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      mysql:
        image: mysql:8.4@sha256:6ea90827b1100f8f2ae306a539f86d2c264a26ed435a2a9f75551dd5c3aeb242
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: gridix_test
          MYSQL_USER: gridix
          MYSQL_PASSWORD: gridix
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    env:
      GRIDIX_TEST_MYSQL_URL: mysql://gridix:gridix@127.0.0.1:3306/gridix_test
      GRIDIX_ACCEPTANCE: "1"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1
        with:
          toolchain: nightly

      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-mysql-it-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-mysql-it-

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev

      - name: Grant MySQL cancellation observer permissions
        run: >-
          docker exec ${{ job.services.mysql.id }}
          mysql -uroot -proot
          -e "GRANT PROCESS, CONNECTION_ADMIN ON *.* TO 'gridix'@'%'; FLUSH PRIVILEGES;"

      - name: Run MySQL typed integration tests
        run: |
          : "${GRIDIX_TEST_MYSQL_URL:?GRIDIX_TEST_MYSQL_URL must be set for release acceptance}"
          test "${GRIDIX_ACCEPTANCE}" = "1" || {
            echo "GRIDIX_ACCEPTANCE must be 1, otherwise the acceptance suites skip and prove nothing"
            exit 1
          }
          cargo test --test mysql_typed_e2e -- --nocapture --test-threads=1
          cargo test --test mysql_cancel_integration -- --nocapture --test-threads=1
          cargo test --test mysql_pool_acceptance -- --nocapture --test-threads=1
