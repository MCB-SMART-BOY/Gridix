# cargo-audit 配置 — 处理已知无法直接升级的传递依赖
#
# 策略：
#   1. 优先在 Cargo.toml / Cargo.lock 中升级
#   2. 仅对无法升级的传递依赖在此豁免

[advisories]
# Exception owner: Gridix maintainers.
# Review by: 2026-12-31. Remove each exception when the transitive dependency is
# upgraded or an equivalent maintained replacement is available.
# Scope: unmaintained transitive dependencies only; this does not waive CVEs.
ignore = [
    # paste 1.0.15 — egui_dock transitive proc-macro with no runtime attack surface.
    "RUSTSEC-2024-0436",
    # rustls-pemfile 2.2.0 — v3 is not available on crates.io yet.
    "RUSTSEC-2025-0134",
]
