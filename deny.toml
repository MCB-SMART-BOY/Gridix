# cargo-deny policy for Gridix dependency advisories.
# Review exceptions with .cargo/audit.toml by 2026-12-31.

[advisories]
ignore = [
    "RUSTSEC-2024-0436", # paste, transitive egui_dock dependency
    "RUSTSEC-2025-0134", # rustls-pemfile, no maintained upgrade in mysql_async
]

[licenses]
allow = [
    "CDLA-Permissive-2.0",
    "BSL-1.0",
    "OFL-1.1",
    "Ubuntu-font-1.0",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
